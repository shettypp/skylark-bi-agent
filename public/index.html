<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skylark BI Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel-2: #1a1f2a;
    --border: #262c38;
    --text: #e8eaed;
    --muted: #8b93a1;
    --accent: #5b8bff;
    --accent-dim: #24345f;
    --agent-bubble: #171c26;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(91,139,255,0.06), transparent);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, #5b8bff, #8a5bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: white; flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  #status {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  #status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  #status.ok { color: #4ade80; border-color: #1f4a34; }
  #status.ok .dot { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  #status.err { color: #f87171; border-color: #4a1f1f; }
  #status.err .dot { background: #f87171; }
  #new-chat-btn {
    font-size: 11.5px; padding: 5px 12px; border-radius: 999px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    cursor: pointer;
  }
  #new-chat-btn:hover { color: var(--text); border-color: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .msg { display: flex; gap: 10px; max-width: 92%; align-items: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; margin-top: 2px;
  }
  .msg.agent .avatar { background: linear-gradient(135deg, #5b8bff, #8a5bff); color: white; }
  .msg.user .avatar { background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); }
  .bubble {
    padding: 13px 16px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 14.5px;
    min-width: 0;
    overflow-x: auto;
  }
  .msg.user .bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: var(--agent-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  /* Markdown content styling inside agent bubbles */
  .bubble h1, .bubble h2, .bubble h3 {
    margin: 14px 0 8px; font-weight: 600; line-height: 1.3; color: var(--text);
  }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble h1 { font-size: 17px; } 
  .bubble h2 { font-size: 15.5px; }
  .bubble h3 { font-size: 14.5px; color: #a9c0ff; }
  .bubble p { margin: 8px 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 8px 0; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble strong { color: #cdd8ff; font-weight: 600; }
  .bubble code {
    background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px;
    font-size: 13px; font-family: "SF Mono", Consolas, monospace;
  }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .bubble table {
    border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--border); padding: 6px 10px; text-align: left;
  }
  .bubble th { background: rgba(91,139,255,0.1); font-weight: 600; color: #cdd8ff; }
  .bubble tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 24px 16px;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }
  .chip {
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 14px 24px 22px;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }
  #input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.15s;
  }
  #input:focus { border-color: var(--accent); }
  button#send {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button#send:disabled { background: var(--accent-dim); cursor: default; }
  button#send:not(:disabled):hover { opacity: 0.9; }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    #chat { padding: 16px; gap: 14px; }
    form#composer { padding: 10px 16px 16px; }
    .suggestions { padding: 0 16px 12px; }
    .msg { max-width: 96%; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">S</div>
      <div>
        <h1>Skylark BI Agent</h1>
        <p>Founder-level Q&amp;A over live monday.com Deals + Work Orders data</p>
      </div>
    </div>
    <div class="header-right">
      <button id="new-chat-btn" type="button">New chat</button>
      <div id="status"><span class="dot"></span><span id="status-text">connecting…</span></div>
    </div>
  </header>

  <div id="chat"></div>

  <div class="suggestions" id="suggestions">
    <div class="chip" data-q="How's our pipeline looking right now?">How's our pipeline looking?</div>
    <div class="chip" data-q="Give me a leadership update">Give me a leadership update</div>
    <div class="chip" data-q="Which sectors are performing best in the pipeline?">Best-performing sectors?</div>
    <div class="chip" data-q="Are there any stalled or overdue work orders?">Stalled work orders?</div>
  </div>

  <form id="composer">
    <input id="input" type="text" placeholder="Ask about pipeline, sectors, execution status…" autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>

<script>
  const chatEl = document.getElementById("chat");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  const suggestionsEl = document.getElementById("suggestions");
  const newChatBtn = document.getElementById("new-chat-btn");

  marked.setOptions({ breaks: true, gfm: true });

  let sessionId = null;

  function renderMarkdown(text) {
    const rawHtml = marked.parse(text || "");
    return DOMPurify.sanitize(rawHtml);
  }

  function addMessage(role, text) {
    const msg = document.createElement("div");
    msg.className = "msg " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "You" : "S";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "agent") {
      bubble.innerHTML = renderMarkdown(text);
    } else {
      bubble.textContent = text;
    }

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const msg = document.createElement("div");
    msg.className = "msg agent";
    msg.id = "typing-indicator";
    msg.innerHTML = '<div class="avatar">S</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  function hideTyping() {
    document.getElementById("typing-indicator")?.remove();
  }

  async function startSession() {
    const res = await fetch("/api/session", { method: "POST" });
    const data = await res.json();
    sessionId = data.sessionId;
  }

  async function init() {
    chatEl.innerHTML = "";
    suggestionsEl.style.display = "flex";
    try {
      await startSession();

      const health = await fetch("/api/health").then((r) => r.json());
      if (health.ok) {
        statusEl.className = "ok";
        statusText.textContent = "connected to monday.com";
        addMessage("agent", "Hi — I'm connected to your **" + health.boards.deals.name + "** and **" + health.boards.workOrders.name + "** boards. Ask me about pipeline, sectors, revenue, or execution status.");
      } else {
        throw new Error(health.error);
      }
    } catch (err) {
      statusEl.className = "err";
      statusText.textContent = "connection issue";
      addMessage("agent", "I couldn't connect to monday.com: " + err.message + "\n\nCheck that `MONDAY_API_TOKEN` is set correctly and the boards exist.");
    }
  }

  async function sendMessage(text) {
    if (!text.trim() || !sessionId) return;
    addMessage("user", text);
    input.value = "";
    sendBtn.disabled = true;
    suggestionsEl.style.display = "none";
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: text }),
      });
      const data = await res.json();
      hideTyping();
      if (!res.ok) throw new Error(data.error || "Request failed");
      addMessage("agent", data.reply);
    } catch (err) {
      hideTyping();
      addMessage("agent", "⚠️ " + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    sendMessage(input.value);
  });

  suggestionsEl.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (chip) sendMessage(chip.dataset.q);
  });

  newChatBtn.addEventListener("click", () => {
    init();
  });

  init();
</script>
</body>
</html>
