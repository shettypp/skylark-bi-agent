<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skylark BI Agent</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --border: #262b34;
    --text: #e8eaed;
    --muted: #8b93a1;
    --accent: #4f7fff;
    --accent-dim: #2a3a66;
    --user-bubble: #4f7fff;
    --agent-bubble: #1e232c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  #status {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  #status.ok { color: #4ade80; border-color: #1f4a34; }
  #status.err { color: #f87171; border-color: #4a1f1f; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; gap: 10px; max-width: 90%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: var(--agent-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.agent .bubble strong { color: #a9c0ff; }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 24px 16px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  .chip {
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 16px 24px 24px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  #input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14.5px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  button#send {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button#send:disabled { background: var(--accent-dim); cursor: default; }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Skylark BI Agent</h1>
      <p>Founder-level Q&A over live monday.com Deals + Work Orders data</p>
    </div>
    <div id="status">connecting…</div>
  </header>

  <div id="chat"></div>

  <div class="suggestions" id="suggestions">
    <div class="chip" data-q="How's our pipeline looking right now?">How's our pipeline looking?</div>
    <div class="chip" data-q="Give me a leadership update">Give me a leadership update</div>
    <div class="chip" data-q="Which sectors are performing best in the pipeline?">Best-performing sectors?</div>
    <div class="chip" data-q="Are there any stalled or overdue work orders?">Stalled work orders?</div>
  </div>

  <form id="composer">
    <input id="input" type="text" placeholder="Ask about pipeline, sectors, execution status…" autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>

<script>
  const chatEl = document.getElementById("chat");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const suggestionsEl = document.getElementById("suggestions");

  let sessionId = null;

  function addMessage(role, text) {
    const msg = document.createElement("div");
    msg.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = renderMarkdownLite(text);
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function renderMarkdownLite(text) {
    // minimal, safe-ish markdown: bold, bullets, line breaks
    const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/^- (.+)$/gm, "• $1");
  }

  function showTyping() {
    const msg = document.createElement("div");
    msg.className = "msg agent";
    msg.id = "typing-indicator";
    msg.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  function hideTyping() {
    document.getElementById("typing-indicator")?.remove();
  }

  async function init() {
    try {
      const res = await fetch("/api/session", { method: "POST" });
      const data = await res.json();
      sessionId = data.sessionId;

      const health = await fetch("/api/health").then((r) => r.json());
      if (health.ok) {
        statusEl.textContent = "connected to monday.com";
        statusEl.className = "ok";
        addMessage("agent", "Hi — I'm connected to your **" + health.boards.deals.name + "** and **" + health.boards.workOrders.name + "** boards. Ask me about pipeline, sectors, revenue, or execution status.");
      } else {
        throw new Error(health.error);
      }
    } catch (err) {
      statusEl.textContent = "connection issue";
      statusEl.className = "err";
      addMessage("agent", "I couldn't connect to monday.com: " + err.message + "\n\nCheck that MONDAY_API_TOKEN is set correctly and the boards exist.");
    }
  }

  async function sendMessage(text) {
    if (!text.trim() || !sessionId) return;
    addMessage("user", text);
    input.value = "";
    sendBtn.disabled = true;
    suggestionsEl.style.display = "none";
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: text }),
      });
      const data = await res.json();
      hideTyping();
      if (!res.ok) throw new Error(data.error || "Request failed");
      addMessage("agent", data.reply);
    } catch (err) {
      hideTyping();
      addMessage("agent", "⚠️ " + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    sendMessage(input.value);
  });

  suggestionsEl.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (chip) sendMessage(chip.dataset.q);
  });

  init();
</script>
</body>
</html>
