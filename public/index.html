<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skylark BI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<style>
  :root {
    --bg: #FAFAF9; --panel: #FFFFFF; --panel-2: #F3F4F1;
    --border: #E3E5E0; --border-soft: #ECEEEA;
    --text: #20241F; --muted: #6B756E; --muted-dim: #A2AA9F;
    --accent: #3B6E5E; --accent-soft: #E5EEE9; --accent-text: #FFFFFF;
    --alert: #B15A43; --alert-soft: #F5E6E1;
    --sidebar: #F5F5F3;
    --mono: "IBM Plex Mono", monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #161915; --panel: #1D211C; --panel-2: #232821;
    --border: #333A32; --border-soft: #2A302A;
    --text: #E8EAE4; --muted: #939C8E; --muted-dim: #565F53;
    --accent: #7DB09D; --accent-soft: #223129; --accent-text: #12211B;
    --alert: #D98B72; --alert-soft: #362420;
    --sidebar: #1A1D18;
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent-soft); color: var(--accent); }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text);
    height: 100vh; height: 100dvh; display: flex; overflow: hidden; transition: background 0.2s, color 0.2s;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 264px; flex-shrink: 0; background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: transform 0.2s, background 0.2s, border-color 0.2s;
  }
  .sidebar-header { padding: 16px 14px 10px; }
  .sidebar-brand { display: flex; align-items: center; gap: 9px; padding: 4px 4px 14px; }
  .sidebar-brand svg { width: 22px; height: 22px; flex-shrink: 0; }
  .sidebar-brand span { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  #new-chat-btn {
    width: 100%; display: flex; align-items: center; gap: 8px;
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    padding: 9px 12px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; border-radius: 14px;
    transition: border-color 0.15s, background 0.15s;
  }
  #new-chat-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  #new-chat-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #new-chat-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  .sidebar-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted-dim); padding: 14px 18px 6px;
  }
  #chat-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .chat-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; margin: 2px 0; border-radius: 12px; cursor: pointer;
    color: var(--muted); font-size: 13px; position: relative;
    transition: background 0.12s, color 0.12s;
  }
  .chat-item:hover { background: var(--panel-2); color: var(--text); }
  .chat-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .chat-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .del-btn {
    opacity: 0; width: 18px; height: 18px; flex-shrink: 0; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
    background: transparent; border: none; cursor: pointer;
  }
  .chat-item:hover .del-btn { opacity: 1; }
  .chat-item .del-btn:hover { background: var(--border); color: var(--alert); }
  .chat-item .del-btn svg { width: 12px; height: 12px; }
  .chat-empty-hint { padding: 10px 14px; font-size: 12px; color: var(--muted-dim); line-height: 1.5; }

  .sidebar-footer {
    padding: 10px 14px 14px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  #theme-toggle {
    width: 30px; height: 30px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, color 0.15s;
  }
  #theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  #theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #theme-toggle svg { width: 15px; height: 15px; }
  #theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] #theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] #theme-toggle .icon-moon { display: block; }

  #status {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.03em;
    padding: 5px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); display: flex; align-items: center; gap: 6px;
  }
  #status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-dim); flex-shrink: 0; }
  #status.ok { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  #status.ok .dot { background: var(--accent); animation: pulse 2.4s infinite; }
  #status.err { color: var(--alert); border-color: var(--alert); background: var(--alert-soft); }
  #status.err .dot { background: var(--alert); }
  @media (prefers-reduced-motion: reduce) { #status.ok .dot { animation: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  #sidebar-toggle-mobile {
    display: none; width: 32px; height: 32px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    cursor: pointer; align-items: center; justify-content: center;
  }
  #sidebar-toggle-mobile svg { width: 16px; height: 16px; }

  /* ---------- Main column ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.03;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><g fill="none" stroke="%233B6E5E" stroke-width="1"><path d="M-50 80 Q 150 20 300 80 T 650 80"/><path d="M-50 150 Q 150 90 300 150 T 650 150"/><path d="M-50 220 Q 150 160 300 220 T 650 220"/><path d="M-50 300 Q 150 380 300 300 T 650 300"/><path d="M-50 380 Q 150 440 300 380 T 650 380"/><path d="M-50 460 Q 150 400 300 460 T 650 460"/><path d="M-50 540 Q 150 480 300 540 T 650 540"/></g></svg>');
    background-size: 700px 700px; background-repeat: repeat;
  }

  header {
    position: relative; z-index: 1; padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); transition: background 0.2s, border-color 0.2s;
  }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #chat-title { font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chat-subtitle { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

  #chat-wrap { position: relative; z-index: 1; flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #chat { padding: 24px 28px 8px; display: flex; flex-direction: column; gap: 20px; max-width: 860px; width: 100%; margin: 0 auto; }

  .msg { display: flex; gap: 12px; max-width: 94%; position: relative; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; max-width: 82%; }

  .bubble { padding: 14px 19px; border-radius: 20px; line-height: 1.6; font-size: 14.5px; min-width: 0; overflow-x: auto; }
  .msg.user .bubble { border-bottom-right-radius: 6px; }
  .msg.agent .bubble { border-bottom-left-radius: 6px; }
  .msg.user .bubble { background: var(--accent); color: var(--accent-text); }
  .msg.agent .bubble { background: var(--panel); border: 1px solid var(--border-soft); flex: 1; }

  .bubble h1, .bubble h2, .bubble h3 { font-family: var(--mono); font-weight: 600; line-height: 1.3; color: var(--text); margin: 16px 0 8px; }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble h1 { font-size: 15px; } .bubble h2 { font-size: 14px; }
  .bubble h3 { font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
  .bubble p { margin: 8px 0; } .bubble p:first-child { margin-top: 0; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 8px 0; padding-left: 20px; } .bubble li { margin: 4px 0; }
  .bubble strong { color: var(--text); font-weight: 700; }
  .msg.user .bubble strong { color: var(--accent-text); }
  .bubble code { background: var(--accent-soft); color: var(--accent); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; font-family: var(--mono); }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 12.5px; font-family: var(--mono); }
  .bubble th, .bubble td { border: 1px solid var(--border-soft); padding: 7px 10px; text-align: left; }
  .bubble th { background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; }
  .bubble tr:nth-child(even) td { background: var(--panel-2); }

  .progress-text { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .progress-text .typing { display: flex; gap: 4px; }
  .typing span { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; } .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: 0.7; } }

  .suggestions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 4px 28px 18px; max-width: 860px; margin: 0 auto; width: 100%; }
  .chip { font-family: var(--sans); font-size: 12.5px; padding: 3px 0; background: none; border: none; color: var(--muted); cursor: pointer; transition: color 0.15s; border-bottom: 1px solid transparent; }
  .chip:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  form#composer { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px;
    padding: 8px 8px 8px 18px; margin: 14px auto 22px; max-width: 860px; width: calc(100% - 56px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 26px;
    transition: border-color 0.15s;
  }
  form#composer:focus-within { border-color: var(--accent); }
  #input { flex: 1; background: none; border: none; color: var(--text); padding: 8px 0; font-size: 14.5px; font-family: var(--sans); outline: none; }
  #input::placeholder { color: var(--muted-dim); }
  button#send {
    width: 36px; height: 36px; flex-shrink: 0; background: var(--accent); color: var(--accent-text);
    border: none; border-radius: 50%; cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  button#send svg { width: 17px; height: 17px; }
  button#send:hover:not(:disabled) { opacity: 0.88; }
  button#send:active:not(:disabled) { transform: scale(0.94); }
  button#send:disabled { opacity: 0.35; cursor: default; }
  button#send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .msg { animation: rise 0.2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }

  @media (max-width: 780px) {
    #sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); box-shadow: 8px 0 24px rgba(0,0,0,0.15); }
    #sidebar.open { transform: translateX(0); }
    #sidebar-toggle-mobile { display: flex; }
    #chat-subtitle { display: none; }
    header { padding: 12px 16px; }
    #chat { padding: 18px 16px 8px; gap: 16px; }
    form#composer { width: calc(100% - 32px); padding: 6px 6px 6px 16px; }
    .suggestions { padding: 4px 16px 12px; }
    .msg { max-width: 98%; } .msg.user { max-width: 90%; }
  }
  #sidebar-backdrop { display: none; }
  @media (max-width: 780px) {
    #sidebar-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 19; }
  }
</style>
</head>
<body>
  <div id="sidebar-backdrop"></div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="3" fill="#3B6E5E"/>
          <circle cx="8" cy="10" r="4" stroke="#3B6E5E" stroke-width="1.5" opacity="0.6"/>
          <circle cx="32" cy="10" r="4" stroke="#3B6E5E" stroke-width="1.5" opacity="0.6"/>
          <circle cx="8" cy="30" r="4" stroke="#3B6E5E" stroke-width="1.5" opacity="0.6"/>
          <circle cx="32" cy="30" r="4" stroke="#3B6E5E" stroke-width="1.5" opacity="0.6"/>
          <line x1="20" y1="20" x2="10.5" y2="12" stroke="#A2AA9F" stroke-width="1.5"/>
          <line x1="20" y1="20" x2="29.5" y2="12" stroke="#A2AA9F" stroke-width="1.5"/>
          <line x1="20" y1="20" x2="10.5" y2="28" stroke="#A2AA9F" stroke-width="1.5"/>
          <line x1="20" y1="20" x2="29.5" y2="28" stroke="#A2AA9F" stroke-width="1.5"/>
        </svg>
        <span>Skylark BI</span>
      </div>
      <button id="new-chat-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
    </div>
    <div class="sidebar-label">Recent</div>
    <div id="chat-list"></div>
    <div class="sidebar-footer">
      <div id="status"><span class="dot"></span><span id="status-text">Connecting…</span></div>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </aside>

  <div id="main">
    <header>
      <div class="header-left">
        <button id="sidebar-toggle-mobile" type="button" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div>
          <div id="chat-title">New chat</div>
          <div id="chat-subtitle">Live data — Deals + Work Orders boards</div>
        </div>
      </div>
    </header>

    <div id="chat-wrap"><div id="chat"></div></div>

    <div class="suggestions" id="suggestions">
      <div class="chip" data-q="How's our pipeline looking right now?">Pipeline status</div>
      <div class="chip" data-q="Give me a leadership update">Leadership update</div>
      <div class="chip" data-q="Which sectors are performing best in the pipeline?">Best sectors</div>
      <div class="chip" data-q="Are there any stalled or overdue work orders?">Stalled work orders</div>
    </div>

    <form id="composer">
      <input id="input" type="text" placeholder="Ask about pipeline, sectors, execution status…" autocomplete="off" />
      <button id="send" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
  </div>

<script>
  const chatEl = document.getElementById("chat");
  const chatWrap = document.getElementById("chat-wrap");
  const chatTitleEl = document.getElementById("chat-title");
  const form = document.getElementById("composer");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  const suggestionsEl = document.getElementById("suggestions");
  const newChatBtn = document.getElementById("new-chat-btn");
  const themeToggle = document.getElementById("theme-toggle");
  const chatListEl = document.getElementById("chat-list");
  const sidebarEl = document.getElementById("sidebar");
  const sidebarBackdrop = document.getElementById("sidebar-backdrop");
  const sidebarToggleMobile = document.getElementById("sidebar-toggle-mobile");

  marked.setOptions({ breaks: true, gfm: true });

  const STORAGE_KEY = "skylark-chats-v1";
  const GREETING = "Hi — I'm connected to your **{deals}** and **{wo}** boards. Ask me about pipeline, sectors, revenue, or execution status.";
  const PROGRESS_PHRASES = ["Thinking…", "Querying monday.com…", "Cross-referencing boards…", "Analyzing data quality…", "Drafting response…"];

  let store = loadStore();
  let activeChatId = null;
  let liveServerSessionId = {}; // chatId -> sessionId established during this page load
  let boardNames = { deals: "Deals", workOrders: "Work Orders" };
  let progressInterval = null;

  function loadStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { chats: {}, order: [] };
  }
  function saveStore() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch (e) {}
  }

  // ---------- Theme ----------
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeToggle.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
    try { localStorage.setItem("skylark-theme", theme); } catch (e) {}
  }
  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem("skylark-theme"); } catch (e) {}
    if (saved === "light" || saved === "dark") applyTheme(saved);
    else applyTheme(window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  themeToggle.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    applyTheme(current === "dark" ? "light" : "dark");
  });

  // ---------- Sidebar mobile toggle ----------
  function toggleSidebarMobile(open) {
    sidebarEl.classList.toggle("open", open);
    sidebarBackdrop.classList.toggle("open", open);
  }
  sidebarToggleMobile.addEventListener("click", () => toggleSidebarMobile(!sidebarEl.classList.contains("open")));
  sidebarBackdrop.addEventListener("click", () => toggleSidebarMobile(false));

  // ---------- Markdown ----------
  function renderMarkdown(text) {
    return DOMPurify.sanitize(marked.parse(text || ""));
  }

  // ---------- Rendering messages ----------
  function renderMessageEl(role, text) {
    const msg = document.createElement("div");
    msg.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "agent") bubble.innerHTML = renderMarkdown(text);
    else bubble.textContent = text;
    msg.appendChild(bubble);
    return msg;
  }

  function renderChatFromCache(chatId) {
    chatEl.innerHTML = "";
    const chat = store.chats[chatId];
    if (!chat) return;
    for (const m of chat.messages) {
      chatEl.appendChild(renderMessageEl(m.role, m.text));
    }
    chatWrap.scrollTop = chatWrap.scrollHeight;
    suggestionsEl.style.display = chat.messages.filter((m) => !m.system).length === 0 ? "flex" : "none";
  }

  function renderSidebarList() {
    chatListEl.innerHTML = "";
    if (store.order.length === 0) {
      const hint = document.createElement("div");
      hint.className = "chat-empty-hint";
      hint.textContent = "Your conversations will appear here.";
      chatListEl.appendChild(hint);
      return;
    }
    for (const chatId of store.order) {
      const chat = store.chats[chatId];
      if (!chat) continue;
      const item = document.createElement("div");
      item.className = "chat-item" + (chatId === activeChatId ? " active" : "");
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = chat.title;
      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.type = "button";
      delBtn.setAttribute("aria-label", "Delete chat");
      delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
      delBtn.addEventListener("click", (e) => { e.stopPropagation(); deleteChat(chatId); });
      item.appendChild(title);
      item.appendChild(delBtn);
      item.addEventListener("click", () => switchToChat(chatId));
      chatListEl.appendChild(item);
    }
  }

  function deleteChat(chatId) {
    delete store.chats[chatId];
    store.order = store.order.filter((id) => id !== chatId);
    delete liveServerSessionId[chatId];
    saveStore();
    if (activeChatId === chatId) {
      if (store.order.length > 0) switchToChat(store.order[0]);
      else startNewChat();
    } else {
      renderSidebarList();
    }
  }

  function makeTitle(text) {
    const clean = text.trim().replace(/\s+/g, " ");
    return clean.length > 42 ? clean.slice(0, 42) + "…" : clean;
  }

  // ---------- Server session handling ----------
  async function ensureServerSession(chatId) {
    if (liveServerSessionId[chatId]) return liveServerSessionId[chatId];
    const chat = store.chats[chatId];
    const messages = chat ? chat.messages : [];
    const res = await fetch("/api/session/resume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not start session");
    liveServerSessionId[chatId] = data.sessionId;
    return data.sessionId;
  }

  // ---------- Chat lifecycle ----------
  function startNewChat() {
    const chatId = "c_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
    store.chats[chatId] = {
      title: "New chat",
      createdAt: Date.now(),
      messages: [{ role: "agent", text: GREETING.replace("{deals}", boardNames.deals).replace("{wo}", boardNames.workOrders), system: true }],
    };
    activeChatId = chatId;
    // Not added to store.order until the user sends a real first message.
    chatTitleEl.textContent = "New chat";
    renderChatFromCache(chatId);
    renderSidebarList();
    toggleSidebarMobile(false);
    input.focus();
  }

  function switchToChat(chatId) {
    if (!store.chats[chatId]) return;
    activeChatId = chatId;
    chatTitleEl.textContent = store.chats[chatId].title;
    renderChatFromCache(chatId);
    renderSidebarList();
    toggleSidebarMobile(false);
  }

  function persistMessage(chatId, role, text, system) {
    const chat = store.chats[chatId];
    if (!chat) return;
    chat.messages.push({ role, text, system: !!system });
    if (!store.order.includes(chatId)) {
      store.order.unshift(chatId);
    }
    if (chat.title === "New chat" && role === "user") {
      chat.title = makeTitle(text);
    }
    saveStore();
  }

  // ---------- Progress messaging ----------
  function showProgress() {
    const msg = document.createElement("div");
    msg.className = "msg agent thinking";
    msg.id = "typing-indicator";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = '<div class="progress-text"><span class="typing"><span></span><span></span><span></span></span><span id="progress-label">' + PROGRESS_PHRASES[0] + '</span></div>';
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatWrap.scrollTop = chatWrap.scrollHeight;

    let i = 0;
    progressInterval = setInterval(() => {
      i = Math.min(i + 1, PROGRESS_PHRASES.length - 1);
      const label = document.getElementById("progress-label");
      if (label) label.textContent = PROGRESS_PHRASES[i];
    }, 2800);
  }
  function hideProgress() {
    if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
    document.getElementById("typing-indicator")?.remove();
  }

  // ---------- Sending ----------
  async function sendMessage(text) {
    if (!text.trim() || !activeChatId) return;
    const chatId = activeChatId;

    chatEl.appendChild(renderMessageEl("user", text));
    chatWrap.scrollTop = chatWrap.scrollHeight;
    persistMessage(chatId, "user", text);
    renderSidebarList();

    input.value = "";
    sendBtn.disabled = true;
    suggestionsEl.style.display = "none";
    showProgress();

    try {
      const sessionId = await ensureServerSession(chatId);
      let res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: text }),
      });
      let data = await res.json();

      if (!res.ok && res.status === 400) {
        // Server forgot this session (e.g. restarted) - rehydrate and retry once.
        delete liveServerSessionId[chatId];
        const freshId = await ensureServerSession(chatId);
        res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId: freshId, message: text }),
        });
        data = await res.json();
      }

      hideProgress();
      if (!res.ok) throw new Error(data.error || "Request failed");

      chatEl.appendChild(renderMessageEl("agent", data.reply));
      chatWrap.scrollTop = chatWrap.scrollHeight;
      persistMessage(chatId, "agent", data.reply);
      if (chatId === activeChatId) chatTitleEl.textContent = store.chats[chatId].title;
    } catch (err) {
      hideProgress();
      const errText = "⚠️ " + err.message;
      chatEl.appendChild(renderMessageEl("agent", errText));
      chatWrap.scrollTop = chatWrap.scrollHeight;
      persistMessage(chatId, "agent", errText);
    } finally {
      sendBtn.disabled = false;
      input.focus();
      renderSidebarList();
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); sendMessage(input.value); });
  suggestionsEl.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (chip) sendMessage(chip.dataset.q);
  });
  newChatBtn.addEventListener("click", startNewChat);

  // ---------- Init ----------
  async function init() {
    initTheme();
    try {
      const health = await fetch("/api/health").then((r) => r.json());
      if (health.ok) {
        boardNames = { deals: health.boards.deals.name, workOrders: health.boards.workOrders.name };
        statusEl.className = "ok";
        statusText.textContent = "Connected";
      } else {
        throw new Error(health.error);
      }
    } catch (err) {
      statusEl.className = "err";
      statusText.textContent = "Connection issue";
    }

    if (store.order.length > 0) {
      switchToChat(store.order[0]);
    } else {
      startNewChat();
    }
  }

  init();
</script>
</body>
</html>
